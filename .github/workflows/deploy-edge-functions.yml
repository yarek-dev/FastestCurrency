name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-supabase-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy all functions
    environment: Supabase Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Link Supabase project
        run: >-
          supabase link
          --project-ref "$SUPABASE_PROJECT_REF"
          --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        run: supabase db push --linked --yes

      - name: Deploy all Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"

      - name: Verify Telegram webhook starts
        run: |
          webhook_url="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/telegram-webhook"
          # A GET reaches the handler and returns 405 without sending a Telegram update.
          for attempt in {1..6}; do
            if status=$(curl --silent --show-error --max-time 10 --output /dev/null --write-out '%{http_code}' "$webhook_url") && [[ "$status" == 405 ]]; then
              exit 0
            fi
            echo "Attempt $attempt returned HTTP $status"
            if [[ "$attempt" != 6 ]]; then sleep 5; fi
          done
          exit 1
